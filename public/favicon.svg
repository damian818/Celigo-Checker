<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#050B14" />
    </linearGradient>
    <linearGradient id="loopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="loopRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="110" fill="#0B1220"/>
  
  <!-- Outer Shield Outline with Glow -->
  <path d="M 256 70 C 316 95 385 105 410 120 C 410 260 370 365 256 442 C 142 365 102 260 102 120 C 127 105 196 95 256 70 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#shieldGrad)" 
        stroke-width="16" 
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Left Infinity Loop -->
  <circle cx="210" cy="256" r="62" fill="none" stroke="url(#loopLeft)" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Right Infinity Loop -->
  <circle cx="302" cy="256" r="62" fill="none" stroke="url(#loopRight)" stroke-width="26" stroke-linecap="round"/>

  <!-- Center Top Red Alert Indicator -->
  <circle cx="256" cy="226" r="13" fill="#F87171" stroke="#0B1220" stroke-width="4"/>

  <!-- Center Green Remediation Checkmark -->
  <path d="M 226 260 L 250 286 L 298 228" 
        fill="none" 
        stroke="url(#checkGrad)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
