
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0F172A" />
        <stop offset="100%" stop-color="#080E1A" />
      </linearGradient>
      <linearGradient id="hLoopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38BDF8" />
        <stop offset="100%" stop-color="#0284C7" />
      </linearGradient>
      <linearGradient id="hLoopRight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0284C7" />
        <stop offset="100%" stop-color="#2563EB" />
      </linearGradient>
      <linearGradient id="hCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ADE80" />
        <stop offset="100%" stop-color="#22C55E" />
      </linearGradient>
    </defs>
    <rect width="680" height="160" rx="80" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />
    
    <!-- Emblem -->
    <g transform="translate(25, 20)">
      <circle cx="55" cy="60" r="34" fill="none" stroke="url(#hLoopLeft)" stroke-width="14" stroke-linecap="round"/>
      <circle cx="105" cy="60" r="34" fill="none" stroke="url(#hLoopRight)" stroke-width="14" stroke-linecap="round"/>
      <circle cx="80" cy="44" r="7" fill="#F87171" stroke="#0B1220" stroke-width="2"/>
      <path d="M 64 63 L 77 76 L 102 46" fill="none" stroke="url(#hCheckGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Divider -->
    <line x1="380" y1="40" x2="380" y2="120" stroke="#334155" stroke-width="2" />

    <!-- Typography -->
    <text x="190" y="98" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" fill="#FFFFFF">Gappify</text>
    <text x="400" y="72" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#94A3B8">Celigo</text>
    <text x="400" y="104" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#94A3B8">Remediation Hub</text>
  </svg>
  